name: 牛久・千葉 微量雨監視

on:
  schedule:
   - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  light-rain-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check light rain and notify
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          python - <<'PY'
          import csv
          import io
          import urllib.request
          import os
          import subprocess
          import json

          url = "https://www.data.jma.go.jp/stats/data/mdrr/pre_rct/alltable/pre1h00_rct.csv"

          data = urllib.request.urlopen(url).read().decode("shift_jis")
          rows = list(csv.reader(io.StringIO(data)))

          header = rows[0]
          rain_index = header.index("現在値(mm)")

          # 監視する観測所
          stations = {
              "45291": "牛久",
              "45212": "千葉"
          }

          results = {}

          for station_id, station_name in stations.items():
              target = None
              for row in rows[1:]:
                  if row[0] == station_id:
                      target = row
                      break

              if target is None:
                  print(f"{station_name}（{station_id}）が見つかりません")
                  continue

              year = target[4]
              month = target[5]
              day = target[6]
              hour = target[7]
              minute = target[8]
              rain = float(target[rain_index])

              print(f"{station_name} {year}/{month}/{day} {hour}:{minute}  1時間降水量: {rain:.1f} mm")

              results[station_id] = {
                  "name": station_name,
                  "rain": rain,
                  "is_raining": rain >= 0.1,
                  "time": f"{year}/{month}/{day} {hour}:{minute}"
              }

          # 前回状態を読み込む
          state_file = "light_rain_state.json"

          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  state = json.load(f)
          else:
              state = {}

          new_state = {}

          for station_id, info in results.items():
              previous_raining = state.get(station_id, False)
              is_raining = info["is_raining"]

              print(f"{info['name']} 前回: {'降っていた' if previous_raining else '降っていなかった'} → 現在: {'降っている' if is_raining else '降っていない'}")

              if is_raining and not previous_raining:
                  message = (
                      f"☔ 微量の雨を検知\n"
                      f"{info['name']}の1時間降水量：{info['rain']:.1f} mm\n"
                      f"観測時刻：{info['time']}"
                  )

                  result = subprocess.run([
                      "curl", "-s",
                      "--form-string", f"token={os.environ['PUSHOVER_API_TOKEN']}",
                      "--form-string", f"user={os.environ['PUSHOVER_USER_KEY']}",
                      "--form-string", "title=牛久・千葉 微量雨監視",
                      "--form-string", f"message={message}",
                      "https://api.pushover.net/1/messages.json"
                  ], capture_output=True, text=True)

                  print("Pushover API:", result.stdout)

                  if result.returncode != 0:
                      raise Exception("Pushover送信に失敗しました")

                  print(f"{info['name']} 降り始め検知 → 通知を送信しました")
                  new_state[station_id] = True

              elif not is_raining and previous_raining:
                  print(f"{info['name']} 雨が止みました → 状態をリセット")
                  new_state[station_id] = False

              else:
                  print(f"{info['name']} 変化なし")
                  new_state[station_id] = previous_raining

          # 状態を保存
          with open(state_file, "w") as f:
              json.dump(new_state, f)

          # GitHubへ状態を保存
          subprocess.run(["git", "config", "user.name", "github-actions"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "light_rain_state.json"], check=True)

          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "commit", "-m", "Update light rain state"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("状態をGitHubへ保存しました")
          else:
              print("状態変更なし")
          PY
