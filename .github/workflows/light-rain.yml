name: 牛久 微量雨監視

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  light-rain-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check light rain and notify
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          python - <<'PY'
          import csv
          import io
          import urllib.request
          import os
          import subprocess
          import json

          url = "https://www.data.jma.go.jp/stats/data/mdrr/pre_rct/alltable/pre1h00_rct.csv"

          data = urllib.request.urlopen(url).read().decode("shift_jis")
          rows = list(csv.reader(io.StringIO(data)))

          header = rows[0]
          rain_index = header.index("現在値(mm)")

          ushiku = None
          for row in rows[1:]:
              if row[0] == "45291":
                  ushiku = row
                  break

          if ushiku is None:
              raise Exception("牛久（観測所番号45291）が見つかりません")

          year = ushiku[4]
          month = ushiku[5]
          day = ushiku[6]
          hour = ushiku[7]
          minute = ushiku[8]

          rain = float(ushiku[rain_index])

          print(f"牛久 {year}/{month}/{day} {hour}:{minute}")
          print(f"1時間降水量: {rain:.1f} mm")

          is_raining = rain >= 0.1

          state_file = "light_rain_state.json"

          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  state = json.load(f)
              previous_raining = state.get("raining", False)
          else:
              previous_raining = False

          print(f"前回: {'降っていた' if previous_raining else '降っていなかった'}")

          if is_raining and not previous_raining:
              message = (
                  f"☔ 微量の雨を検知\n"
                  f"牛久の1時間降水量：{rain:.1f} mm\n"
                  f"観測時刻：{year}/{month}/{day} {hour}:{minute}"
              )

              result = subprocess.run([
                  "curl", "-s",
                  "--form-string", f"token={os.environ['PUSHOVER_API_TOKEN']}",
                  "--form-string", f"user={os.environ['PUSHOVER_USER_KEY']}",
                  "--form-string", "title=牛久 微量雨監視",
                  "--form-string", f"message={message}",
                  "https://api.pushover.net/1/messages.json"
              ], capture_output=True, text=True)

              print("Pushover API:", result.stdout)

              if result.returncode != 0:
                  raise Exception("Pushover送信に失敗しました")

              print("降り始め検知 → 通知を送信しました")
              state = {"raining": True}

          elif not is_raining and previous_raining:
              print("雨が止みました → 状態をリセット")
              state = {"raining": False}

          else:
              print("変化なし → 通知しません")
              state = {"raining": previous_raining}

          with open(state_file, "w") as f:
              json.dump(state, f)

          subprocess.run(["git", "config", "user.name", "github-actions"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "light_rain_state.json"], check=True)

          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "commit", "-m", "Update light rain state"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("状態をGitHubへ保存しました")
          else:
              print("状態変更なし")
          PY
