name: 牛久雨量感知システム作動通知

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  morning-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send morning Pushover notification
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_API_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=牛久雨量感知システム作動通知" \
            --form-string "message=牛久雨量監視システムは本日も正常に作動しています。" \
            https://api.pushover.net/1/messages.json
