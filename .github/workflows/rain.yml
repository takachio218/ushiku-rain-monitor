name: Ushiku Rain Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  rain:
    runs-on: ubuntu-latest

    steps:
      - name: Check Ushiku rain
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          python - <<'PY'
          import csv
          import io
          import urllib.request
          import os
          import subprocess

          url = "https://www.data.jma.go.jp/stats/data/mdrr/pre_rct/alltable/pre1h00_rct.csv"

          data = urllib.request.urlopen(url).read().decode("shift_jis")
          rows = list(csv.reader(io.StringIO(data)))

          header = rows[0]
          rain_index = header.index("現在値(mm)")

          ushiku = None

          for row in rows[1:]:
              if row[0] == "45291":
                  ushiku = row
                  break

          if ushiku is None:
              raise Exception("牛久（観測所番号45291）が見つかりません")

          year = ushiku[4]
          month = ushiku[5]
          day = ushiku[6]
          hour = ushiku[7]
          minute = ushiku[8]

          rain = float(ushiku[rain_index])

          print(f"牛久 {year}/{month}/{day} {hour}:{minute}")
          print(f"1時間降水量: {rain:.1f} mm")

          if rain >= 1.0:

              message = (
                  f"牛久の1時間降水量：{rain:.1f} mm\n"
                  f"観測時刻：{year}/{month}/{day} {hour}:{minute}"
              )

              result = subprocess.run([
                  "curl", "-s",
                  "--form-string",
                  f"token={os.environ['PUSHOVER_API_TOKEN']}",
                  "--form-string",
                  f"user={os.environ['PUSHOVER_USER_KEY']}",
                  "--form-string",
                  "title=牛久雨量監視システム",
                  "--form-string",
                  f"message={message}",
                  "https://api.pushover.net/1/messages.json"
              ], capture_output=True, text=True)

              print("Pushover API:", result.stdout)

              if result.returncode != 0:
                  raise Exception("Pushover送信に失敗しました")

              print("Pushover通知を送信しました")

          else:
              print("1mm未満なので通知しません")

          PY
